# MusicLoud Backend — Render Blueprint
# This file and Dockerfile are at the repository root.

services:
  - type: web
    name: musicloud-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: update
      - key: SUPABASE_SONGS_BUCKET
        value: songs
      - key: SUPABASE_COVERS_BUCKET
        value: covers
